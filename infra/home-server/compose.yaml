# Production agent on the Mac mini home server. See docs/runbooks/home-server-delivery.md.
# The agent listens on loopback only; the host's Tailscale Funnel publishes it over HTTPS.
# The opt-in `tailscale` profile adds a sidecar node that Funnels :443 to the agent over
# the compose network instead, so the host port can go once the cutover is verified.
name: syshin0116-agent

x-agent: &agent
  image: syshin0116-agent:${AGENT_IMAGE_TAG:?set by deploy.sh}
  # agent.env carries DATABASE_URL for the postgres service below (same password as .env).
  env_file: ./agent.env
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    environment:
      POSTGRES_USER: agent
      POSTGRES_DB: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *agent
    entrypoint: ["python", "-m", "agent.migrate"]
    restart: "no"
    profiles: [ops]

  agent:
    <<: *agent
    ports:
      - "127.0.0.1:${AGENT_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  # Replaces the Cloud Scheduler job: expired guest threads and stale guest runs every 15 minutes.
  maintenance:
    <<: *agent
    entrypoint: ["sh", "-c", "while true; do python -m agent.maintenance || echo 'maintenance failed' >&2; sleep 900; done"]

  # Opt-in (profile `tailscale`): deploy.sh starts it only when TS_AUTHKEY is set in .env.
  # Userspace networking, so no /dev/net/tun or extra capabilities are needed.
  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    profiles: [tailscale]
    hostname: ${TS_HOSTNAME:-syshin0116-agent}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-syshin0116-agent}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    configs:
      - source: tailscale-serve
        target: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

configs:
  # `$$` keeps compose from interpolating; tailscaled substitutes its own cert domain.
  tailscale-serve:
    content: |
      {
        "TCP": {"443": {"HTTPS": true}},
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": {"/": {"Proxy": "http://agent:8080"}}
          }
        },
        "AllowFunnel": {"$${TS_CERT_DOMAIN}:443": true}
      }

volumes:
  postgres-data:
  tailscale-state:
